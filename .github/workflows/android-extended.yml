name: Build openGym Extended for Android

on:
  workflow_dispatch:
    inputs:
      draft_release:
        description: Create a release draft with the signed APK
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: opengym-extended-android
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'qrkks/openGym-Extended' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.value }}
      revision: ${{ steps.version.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Set the Extended app version
        id: version
        working-directory: frontend
        run: |
          base=$(node -p 'require("./package.json").version')
          [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          # Continue after the last release from the old repo, 1.4.5.7 (version code 1000007).
          revision=$((7 + GITHUB_RUN_NUMBER))
          echo "value=$base.$revision" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Install frontend dependencies and run tests
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Build and check the mobile bundle with bundled exercise media
        working-directory: frontend
        env:
          APP_EXTENDED_REVISION: ${{ steps.version.outputs.revision }}
          VITE_EXTENDED_ANDROID: '1'
        run: npm run build:mobile
      - name: Build the Android release APK
        working-directory: frontend/android
        env:
          APP_EXTENDED_REVISION: ${{ steps.version.outputs.revision }}
        run: ./gradlew --no-daemon -PextendedRevision="$APP_EXTENDED_REVISION" testExtendedDebugUnitTest assembleExtendedRelease
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: extended-unsigned
          path: frontend/android/app/build/outputs/apk/extended/release/app-extended-release-unsigned.apk
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: android-release
    steps:
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: extended-unsigned
      - name: Sign and verify the APK
        env:
          VERSION: ${{ needs.build.outputs.version }}
          REVISION: ${{ needs.build.outputs.revision }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/36.0.0"
          : "${ANDROID_KEYSTORE_B64:?Configure the Android release keystore secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Configure the Android release password secret}"
          key=$(mktemp)
          aligned=$(mktemp)
          trap 'rm -f -- "$key" "$aligned"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$key"

          # The stored keystore may still use its original alias. Rename the entry
          # in the temporary copy and verify the same certificate after signing.
          if ! keytool -list -alias opengym-extended -keystore "$key" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD >/dev/null 2>&1; then
            keytool -changealias -alias opengym-personal -destalias opengym-extended \
              -keystore "$key" -storepass:env ANDROID_KEYSTORE_PASSWORD \
              -keypass:env ANDROID_KEYSTORE_PASSWORD
          fi

          mkdir signed
          file="openGym-Extended-$VERSION.apk"
          "$tools/zipalign" -P 16 -f 4 app-extended-release-unsigned.apk "$aligned"
          "$tools/apksigner" sign --ks "$key" --ks-key-alias opengym-extended \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --v4-signing-enabled false \
            --out "signed/$file" "$aligned"
          "$tools/zipalign" -c -P 16 4 "signed/$file"
          "$tools/apksigner" verify --print-certs "signed/$file" |
            grep -Fx 'Signer #1 certificate SHA-256 digest: 8cd52a3614766b3f4989912d67ceb65c6bbe5741d38988b6d5fea7c748a83299'

          badging=$("$tools/aapt2" dump badging "signed/$file")
          code=$((1000000 + REVISION))
          grep -F "package: name='io.github.qrkks.opengym' versionCode='$code' versionName='$VERSION'" <<< "$badging"
          grep -F "uses-permission: name='android.permission.REQUEST_INSTALL_PACKAGES'" <<< "$badging"
          (cd signed && sha256sum "$file" > "$file.sha256" && sha256sum --check "$file.sha256")
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: opengym-extended-${{ needs.build.outputs.version }}
          path: signed/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  draft:
    if: inputs.draft_release
    needs: [build, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: opengym-extended-${{ needs.build.outputs.version }}
      - name: Create the GitHub release draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          file="openGym-Extended-$VERSION.apk"
          sha256sum --check "$file.sha256"
          gh release create "extended-v$VERSION" "$file" "$file.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --latest \
            --title "openGym Extended $VERSION" --notes "Signed Android APK for openGym Extended, built from $GITHUB_SHA."
